<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario de registro de usuarios.">
  <title>Registro | Control de asistencia</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand brand-header" href="index.html">
      <span class="brand-symbol">CA</span>
      <span class="brand-name">CONTROL DE ASISTENCIA</span>
    </a>
    <a class="header-link" href="index.html">← Regresar al acceso</a>
  </header>

  <main class="page-container page-narrow">
    <div class="page-title">
      <span class="overline">ALTA DE PERSONAL</span>
      <h1>Registro de usuario</h1>
      <p>Captura la información solicitada. Los campos marcados son obligatorios.</p>
    </div>

    <form class="panel form" id="registerForm" action="registro_result.php" method="post">
      <div class="form-grid">
        <div class="form-field">
          <label for="usuario">Nombre de usuario <span>*</span></label>
          <input id="usuario" name="usuario" type="text" placeholder="Ej. jperez" minlength="4" maxlength="30" pattern="[A-Za-z0-9_.]{4,30}" title="De 4 a 30 caracteres: letras, números, punto o guion bajo" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="nombres">Nombre(s) <span>*</span></label>
          <input id="nombres" name="nombres" type="text" placeholder="Nombre(s)" maxlength="100" autocomplete="given-name" required>
        </div>
        <div class="form-field">
          <label for="apellidoPaterno">Apellido paterno <span>*</span></label>
          <input id="apellidoPaterno" name="apellidoPaterno" type="text" placeholder="Apellido paterno" maxlength="100" autocomplete="family-name" required>
        </div>
        <div class="form-field">
          <label for="apellidoMaterno">Apellido materno <span>*</span></label>
          <input id="apellidoMaterno" name="apellidoMaterno" type="text" placeholder="Apellido materno" maxlength="100" required>
        </div>
        <div class="form-field">
          <label for="fechaNac">Fecha de nacimiento <span>*</span></label>
          <input id="fechaNac" name="fechaNac" type="date" autocomplete="bday" required>
        </div>
        <div class="form-field">
          <label for="correo">Correo electrónico <span>*</span></label>
          <input id="correo" name="correo" type="email" placeholder="usuario@correo.com" maxlength="150" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="telefono">Teléfono (opcional)</label>
          <input id="telefono" name="telefono" type="tel" placeholder="10 dígitos" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="10 dígitos, solo números" autocomplete="tel">
        </div>
        <div class="form-field">
          <label for="puesto">Puesto de trabajo <span>*</span></label>
          <select id="puesto" name="puesto" required>
            <option value="">Selecciona una opción</option>
            <option value="Operador de producción">Operador de producción</option>
            <option value="Técnico de mantenimiento">Técnico de mantenimiento</option>
            <option value="Almacenista">Almacenista</option>
            <option value="Supervisor de línea">Supervisor de línea</option>
            <option value="Seguridad industrial">Seguridad industrial</option>
            <option value="Personal de limpieza">Personal de limpieza</option>
          </select>
        </div>
        <div class="form-field">
          <label for="password">Contraseña <span>*</span></label>
          <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="100" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirmar contraseña <span>*</span></label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite la contraseña" minlength="8" maxlength="100" autocomplete="new-password" required>
        </div>
      </div>
      <p class="form-message" id="registerMessage" role="status" aria-live="polite"></p>
      <div class="form-actions">
        <a class="button button-secondary" href="index.html">Cancelar</a>
        <button class="button button-primary" type="submit">Enviar solicitud <span aria-hidden="true">→</span></button>
      </div>
      <p class="small-note">Al registrarte se te asignará tu número de empleado.</p>
    </form>
  </main>
  <footer class="footer">Sistema de control de asistencia · Interfaz de usuario</footer>
</body>
</html>
